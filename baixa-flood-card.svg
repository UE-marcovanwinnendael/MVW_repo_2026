<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Conceptual terrain study for Lisbon's Baixa</title>
<desc id="desc">Stylized street grid, topographic contours, building footprints and blue flow zones. Not a flood model or GIS result.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b141c"/><stop offset=".54" stop-color="#0e222b"/><stop offset="1" stop-color="#101415"/></linearGradient>
  <radialGradient id="mist"><stop stop-color="#2a9fc0" stop-opacity=".42"/><stop offset="1" stop-color="#102b36" stop-opacity="0"/></radialGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#79cee5" stop-opacity=".74"/><stop offset="1" stop-color="#2f759d" stop-opacity=".08"/></linearGradient>
  <pattern id="fine" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#89b7c4" stroke-opacity=".08" stroke-width="1"/></pattern>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
